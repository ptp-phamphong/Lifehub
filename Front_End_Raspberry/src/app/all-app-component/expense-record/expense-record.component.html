  <!-- Manual Input Mode -->
  <form (ngSubmit)="submitForm()" *ngIf="!aiMode || isEditMode">
    <div class="form-group">
      <label for="reason">{{ 'expense.reason' | translate }}</label>
      <input id="reason" type="text" [(ngModel)]="reason" name="reason" [placeholder]="'expense.reasonPlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="amount">{{ 'expense.amount' | translate }} ({{ 'common.currencySuffix' | translate }})</label>
      <input id="amount" type="text" [value]="formatCurrency(amount)" (input)="onAmountInput($event)" name="amount"
        [placeholder]="'expense.amountPlaceholder' | translate" />
    </div>

    <div class="form-group" *ngIf="isExpenseMode">
      <label for="reasonType">{{ 'expense.reasonType' | translate }}</label>
      <ng-select [(ngModel)]="reasonTypeId" name="reasonTypeId" [items]="reasonTypes" bindLabel="displayName"
        bindValue="id" [placeholder]="'expense.selectReasonType' | translate" [searchable]="true" [clearable]="true">
      </ng-select>
    </div>

    <div class="form-group">
      <label for="expenseDate">{{ dateLabelKey | translate }}</label>
      <mat-form-field appearance="outline" class="date-field">
        <input matInput [matDatepicker]="picker" [(ngModel)]="expenseDate" name="expenseDate"
          [placeholder]="'expense.selectDate' | translate" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <button type="submit">{{ 'common.save' | translate }}</button>
  </form>

  <p class="message" [class.is-success]="messageType === 'success'" [class.is-error]="messageType === 'error'" [class.is-warning]="messageType === 'warning'" *ngIf="messageKey || messageRaw">
    <span class="msym" aria-hidden="true">{{ messageType === 'success' ? 'check_circle' : messageType === 'error' ? 'error' : 'warning' }}</span>
    <span>{{ messageKey ? (messageKey | translate) : messageRaw }}</span>
  </p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  </div>
</div>
