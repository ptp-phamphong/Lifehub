<div class="visitor-log-container">

  <div class="page-head">
    <h2>Nhật ký truy cập</h2>
    <p class="page-sub">Ai đã ghé thăm portfolio, xem trang nào, lúc nào và quay lại bao nhiêu lần.</p>
  </div>

  <!-- Bộ lọc chung cho mọi tab -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Khoảng thời gian</label>
      <div class="range-buttons">
        <button
          *ngFor="let option of rangeOptions"
          class="range-btn"
          [class.active]="selectedRange === option.days"
          (click)="selectedRange = option.days; applyFilter()">
          {{ option.label }}
        </button>
      </div>
    </div>

    <div class="filter-group">
      <label for="area">Khu vực</label>
      <select id="area" [(ngModel)]="selectedArea" (change)="applyFilter()">
        <option [ngValue]="null">Tất cả</option>
        <option [ngValue]="1">Portfolio</option>
        <option [ngValue]="2">Trang đăng nhập</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="path">Trang chứa chữ</label>
      <input id="path" type="text" [(ngModel)]="pathContains" (keyup.enter)="applyFilter()" placeholder="ví dụ: about" />
    </div>

    <div class="filter-group checks">
      <label class="check">
        <input type="checkbox" [(ngModel)]="excludeSelf" (change)="applyFilter()" />
        <span>Ẩn traffic của tôi</span>
      </label>
      <label class="check">
        <input type="checkbox" [(ngModel)]="excludeBots" (change)="applyFilter()" />
        <span>Ẩn bot</span>
      </label>
    </div>

    <button class="btn-apply" (click)="applyFilter()">Lọc</button>
  </div>

  <!-- Đang xem riêng một khách -->
  <div class="visitor-filter-note" *ngIf="filter?.visitorId">
    Đang xem riêng khách <code>{{ filter.visitorId }}</code>
    <button class="btn-clear" (click)="clearVisitorFilter()">Bỏ lọc này</button>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn" [class.active]="activeTab === 'overview'" (click)="setTab('overview')">Tổng quan</button>
    <button class="tab-btn" [class.active]="activeTab === 'visits'" (click)="setTab('visits')">Lượt truy cập</button>
    <button class="tab-btn" [class.active]="activeTab === 'visitors'" (click)="setTab('visitors')">Khách</button>
    <button class="tab-btn" [class.active]="activeTab === 'myips'" (click)="setTab('myips')">IP của tôi</button>
  </div>

  <div class="tab-content">
    <app-visitor-overview
      *ngIf="activeTab === 'overview'"
      [summary]="summary"
      [history]="history">
    </app-visitor-overview>

    <app-visitor-log-list
      *ngIf="activeTab === 'visits'"
      [baseFilter]="filter"
      (dataChanged)="onDataChanged()"
      (showVisitor)="showVisitor($event)">
    </app-visitor-log-list>

    <app-visitor-profile-list
      *ngIf="activeTab === 'visitors'"
      [baseFilter]="filter"
      (dataChanged)="onDataChanged()"
      (showVisitor)="showVisitor($event)">
    </app-visitor-profile-list>

    <app-known-ip-list
      *ngIf="activeTab === 'myips'"
      (dataChanged)="onDataChanged()">
    </app-known-ip-list>
  </div>

  <!-- Giấy phép CC-BY của DB-IP yêu cầu dẫn link về trang chủ khi hiện dữ liệu vị trí -->
  <p class="attribution">
    Dữ liệu vị trí: <a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a>
  </p>
</div>
