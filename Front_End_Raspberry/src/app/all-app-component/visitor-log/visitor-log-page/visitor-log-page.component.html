<div class="visitor-log-container">

  <div class="page-head">
    <h2>{{ 'visitor.title' | translate }}</h2>
    <p class="page-sub">{{ 'visitor.subtitle' | translate }}</p>
  </div>

  <!-- Bộ lọc chung cho mọi tab -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>{{ 'visitor.dateRange' | translate }}</label>
      <div class="range-buttons">
        <button
          *ngFor="let option of rangeOptions"
          class="range-btn"
          [class.active]="selectedRange === option.days"
          (click)="selectedRange = option.days; applyFilter()">
          {{ option.labelKey | translate }}
        </button>
      </div>
    </div>

    <div class="filter-group">
      <label for="area">{{ 'visitor.area' | translate }}</label>
      <select id="area" [(ngModel)]="selectedArea" (change)="applyFilter()">
        <option [ngValue]="null">{{ 'visitor.areaAll' | translate }}</option>
        <!-- "Portfolio" là tên riêng nên không dịch. -->
        <option [ngValue]="1">Portfolio</option>
        <option [ngValue]="2">{{ 'visitor.areaLogin' | translate }}</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="path">{{ 'visitor.pathContains' | translate }}</label>
      <input
        id="path"
        type="text"
        [(ngModel)]="pathContains"
        (keyup.enter)="applyFilter()"
        [placeholder]="'visitor.pathPlaceholder' | translate" />
    </div>

    <div class="filter-group checks">
      <label class="check">
        <input type="checkbox" [(ngModel)]="excludeSelf" (change)="applyFilter()" />
        <span>{{ 'visitor.hideSelf' | translate }}</span>
      </label>
      <label class="check">
        <input type="checkbox" [(ngModel)]="excludeBots" (change)="applyFilter()" />
        <span>{{ 'visitor.hideBots' | translate }}</span>
      </label>
    </div>

    <button class="btn-apply" (click)="applyFilter()">{{ 'visitor.apply' | translate }}</button>
  </div>

  <!-- Đang xem riêng một khách -->
  <div class="visitor-filter-note" *ngIf="filter?.visitorId">
    {{ 'visitor.viewingVisitor' | translate }} <code>{{ filter.visitorId }}</code>
    <button class="btn-clear" (click)="clearVisitorFilter()">{{ 'visitor.clearVisitorFilter' | translate }}</button>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn" [class.active]="activeTab === 'overview'" (click)="setTab('overview')">{{ 'visitor.tabOverview' | translate }}</button>
    <button class="tab-btn" [class.active]="activeTab === 'visits'" (click)="setTab('visits')">{{ 'visitor.tabVisits' | translate }}</button>
    <button class="tab-btn" [class.active]="activeTab === 'visitors'" (click)="setTab('visitors')">{{ 'visitor.tabVisitors' | translate }}</button>
    <button class="tab-btn" [class.active]="activeTab === 'myips'" (click)="setTab('myips')">{{ 'visitor.tabMyIps' | translate }}</button>
  </div>

  <div class="tab-content">
    <app-visitor-overview
      *ngIf="activeTab === 'overview'"
      [summary]="summary"
      [history]="history">
    </app-visitor-overview>

    <app-visitor-log-list
      *ngIf="activeTab === 'visits'"
      [baseFilter]="filter"
      (dataChanged)="onDataChanged()"
      (showVisitor)="showVisitor($event)">
    </app-visitor-log-list>

    <app-visitor-profile-list
      *ngIf="activeTab === 'visitors'"
      [baseFilter]="filter"
      (dataChanged)="onDataChanged()"
      (showVisitor)="showVisitor($event)">
    </app-visitor-profile-list>

    <app-known-ip-list
      *ngIf="activeTab === 'myips'"
      (dataChanged)="onDataChanged()">
    </app-known-ip-list>
  </div>

  <!--
    Giấy phép CC-BY của DB-IP yêu cầu dẫn link về trang chủ khi hiện dữ liệu vị trí.
    Chỉ nhãn dẫn nguồn được dịch; tên "IP Geolocation by DB-IP" phải giữ NGUYÊN VĂN
    ở cả hai ngôn ngữ vì đó là điều kiện của giấy phép.
  -->
  <p class="attribution">
    {{ 'visitor.locationDataBy' | translate }}: <a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a>
  </p>
</div>
