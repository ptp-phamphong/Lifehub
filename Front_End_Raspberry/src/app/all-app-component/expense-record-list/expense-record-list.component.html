<div class="expense-table-container">

  <h2>Danh sách chi tiêu</h2>
  <div>
    <span *ngIf="sumThisMonth > 0">Tổng tháng hiện tại: <b>{{formatCurrency(sumThisMonth)}}</b></span>
    <br>
    <span *ngIf="sumThisWeek > 0">Tổng tuần hiện tại: <b>{{formatCurrency(sumThisWeek)}}</b></span>
  </div>
  <br>
  <button mat-button color="primary" (click)="openEditDialog(0)">Thêm mới</button>

  <table class="expense-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Ngày tháng</th>
        <th>Lý do</th>
        <th>Số tiền</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of expenseRecords">
        <td>{{ item.id }}</td>
        <td>{{ item.createdDate | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ item.reason }}</td>
        <td>{{ formatCurrency(item.amount) }}</td>
        <td>
          <button mat-button color="primary" (click)="openEditDialog(item.id)">Sửa</button>
          <button mat-button color="primary" (click)="deleteRecord(item)">Xoá</button>

          <!-- <button class="btn btn-edit" (click)="openEditDialog(item.id)">Sửa</button>
          <button class="btn btn-delete" (click)="deleteRecord(item)">Xoá</button> -->
        </td>
      </tr>
    </tbody>
  </table>
</div>
