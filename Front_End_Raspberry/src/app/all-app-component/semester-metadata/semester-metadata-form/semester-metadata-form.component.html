<div class="expense-form">
  <h2>{{ id > 0 ? 'Chinh sua hoc ky' : 'Them hoc ky moi' }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="semesterName">Ten hoc ky</label>
      <input id="semesterName" type="text" [(ngModel)]="semesterName" name="semesterName" placeholder="Nhap ten hoc ky..." />
    </div>

    <div class="form-group">
      <label for="codeSemester">Ma hoc ky</label>
      <input id="codeSemester" type="text" [(ngModel)]="codeSemester" name="codeSemester" placeholder="Nhap ma hoc ky..." />
    </div>

    <div class="form-group">
      <label for="year">Nam</label>
      <input id="year" type="number" [(ngModel)]="year" name="year" placeholder="Nhap nam hoc ky..." />
    </div>

    <div class="form-group form-group-checkbox">
      <label for="isCurrentSemester">Hoc ky hien tai</label>
      <label class="toggle">
        <input id="isCurrentSemester" type="checkbox" [(ngModel)]="isCurrentSemester" name="isCurrentSemester" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <button type="submit">Luu</button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">Huy</button>
  </div>
</div>
