<div class="expense-form">
  <h2>{{ (id > 0 ? 'semester.editTitle' : 'semester.addTitle') | translate }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="semesterName">{{ 'semester.name' | translate }}</label>
      <input id="semesterName" type="text" [(ngModel)]="semesterName" name="semesterName" [placeholder]="'semester.namePlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="codeSemester">{{ 'semester.code' | translate }}</label>
      <input id="codeSemester" type="text" [(ngModel)]="codeSemester" name="codeSemester" [placeholder]="'semester.codePlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="year">{{ 'semester.year' | translate }}</label>
      <input id="year" type="number" [(ngModel)]="year" name="year" [placeholder]="'semester.yearPlaceholder' | translate" />
    </div>

    <div class="form-group form-group-checkbox">
      <label for="isCurrentSemester">{{ 'semester.isCurrent' | translate }}</label>
      <label class="toggle">
        <input id="isCurrentSemester" type="checkbox" [(ngModel)]="isCurrentSemester" name="isCurrentSemester" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <button type="submit">{{ 'common.save' | translate }}</button>
  </form>

  <p class="message" *ngIf="messageKey">{{ messageKey | translate }}</p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  </div>
</div>
