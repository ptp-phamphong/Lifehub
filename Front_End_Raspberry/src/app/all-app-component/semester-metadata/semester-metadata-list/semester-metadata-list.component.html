<div class="expense-table-container">
  <h2>Danh sách học kỳ</h2>

  <div class="toolbar">
    <button class="btn-add" (click)="openEditDialog(0)">+ Thêm mới</button>
  </div>

  <table class="expense-table">
    <thead>
      <tr>
        <th>Mã</th>
        <th>Mã học kỳ</th>
        <th>Tên học kỳ</th>
        <th>Năm</th>
        <th>Học kỳ hiện tại</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of semesters">
        <td>{{ item.id }}</td>
        <td>{{ item.codeSemester }}</td>
        <td>{{ item.semesterName }}</td>
        <td>{{ item.year }}</td>
        <td>
          <span class="badge" [class.badge-active]="item.isCurrentSemester" [class.badge-inactive]="!item.isCurrentSemester">
            {{ item.isCurrentSemester ? 'Hiện tại' : 'Không' }}
          </span>
        </td>
        <td class="col-actions">
          <button class="btn-action btn-edit" (click)="openEditDialog(item.id || 0)">Sửa</button>
          <button class="btn-action btn-delete" (click)="deleteRecord(item)">Xóa</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
