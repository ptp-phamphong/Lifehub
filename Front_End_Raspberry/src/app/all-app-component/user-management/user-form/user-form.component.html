<div class="expense-form">
  <h2>{{ dialogTitle }}</h2>

  <form (ngSubmit)="submitForm()">
    <!-- Create mode: username + name + password -->
    <div class="form-group" *ngIf="mode === 'create'">
      <label for="username">Username</label>
      <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Nhap username..." />
    </div>

    <div class="form-group" *ngIf="mode === 'create' || mode === 'edit'">
      <label for="name">Name</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Nhap ten hien thi..." />
    </div>

    <div class="form-group" *ngIf="mode === 'edit'">
      <label>Active</label>
      <select [(ngModel)]="active" name="active">
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>

    <!-- Create or Password mode: password fields -->
    <div class="form-group" *ngIf="mode === 'create' || mode === 'password'">
      <label for="password">{{ mode === 'password' ? 'Mat khau moi' : 'Mat khau' }}</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Nhap mat khau..." />
    </div>

    <div class="form-group" *ngIf="mode === 'create' || mode === 'password'">
      <label for="confirmPassword">Xac nhan mat khau</label>
      <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Nhap lai mat khau..." />
    </div>

    <!-- Edit mode: show username (readonly) -->
    <div class="form-group" *ngIf="mode === 'edit'">
      <label>Username</label>
      <input type="text" [value]="username" disabled />
    </div>

    <button type="submit">Luu</button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">Huy</button>
  </div>
</div>
