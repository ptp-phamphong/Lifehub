<div class="container-fluid mt-4 px-4 main-shell">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0 text-primary">Bảng điều khiển Raspberry</h3>
    <button (click)="logout()" class="btn btn-outline-danger btn-sm">🚪 Đăng xuất</button>
  </div>

  <ul class="nav nav-tabs nav-pills gap-2">
    <li class="nav-item">
      <a
        [routerLink]="['/system-info']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link fw-semibold"
      >🏠 Thông tin hệ thống</a>
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/expense-record-list']"
        routerLinkActive="active"
        class="nav-link fw-semibold"
      >📊 Chi tiêu</a>
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/expense-analytics']"
        routerLinkActive="active"
        class="nav-link fw-semibold"
      >📈 Phân tích</a>
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/course-calendar']"
        routerLinkActive="active"
        class="nav-link fw-semibold"
      >🗓️ Thời khóa biểu</a>
    </li>
    <li class="nav-item">
      <a
        [routerLink]="['/settings']"
        routerLinkActive="active"
        class="nav-link fw-semibold"
      >⚙️ Cài đặt</a>
    </li>
  </ul>

  <div class="mt-3 p-3 border rounded main-content-panel">
    <router-outlet></router-outlet>
  </div>
</div>
