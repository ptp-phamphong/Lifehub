<div class="main-shell">
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <!-- "Raspberry" là tên riêng — không dịch. -->
        <span class="brand-name">Raspberry</span>
        <span class="brand-sub">{{ 'nav.brandSub' | translate }}</span>
      </span>
    </div>

    <div class="app-bar-actions">
      <!-- Đổi theme: một nút, icon cho biết sẽ chuyển SANG chế độ nào. -->
      <button
        type="button"
        class="btn-icon"
        (click)="toggleDarkMode()"
        [title]="(isDarkMode() ? 'theme.switchToLight' : 'theme.switchToDark') | translate"
        [attr.aria-label]="(isDarkMode() ? 'theme.switchToLight' : 'theme.switchToDark') | translate"
        [attr.aria-pressed]="isDarkMode()"
      >
        <span class="msym" aria-hidden="true">{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</span>
      </button>

      <div class="language-switcher">
        <button
          type="button"
          *ngFor="let lang of languages"
          class="lang-button"
          [class.active]="lang === currentLanguage()"
          [attr.aria-pressed]="lang === currentLanguage()"
          (click)="setLanguage(lang)"
        >
          {{ lang | uppercase }}
        </button>
      </div>

      <button (click)="logout()" class="btn-logout" type="button">
        <span class="msym" aria-hidden="true">logout</span>
        <span>{{ 'nav.logout' | translate }}</span>
      </button>
    </div>
  </header>

  <nav class="app-nav" [attr.aria-label]="'nav.mainNavigation' | translate">
    <a
      [routerLink]="['/system-info']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="msym" aria-hidden="true">developer_board</span>
      <span>{{ 'nav.systemInfo' | translate }}</span>
    </a>
    <a [routerLink]="['/expense-record-list']" routerLinkActive="active" class="nav-item">
      <span class="msym" aria-hidden="true">receipt_long</span>
      <span>{{ 'nav.expenses' | translate }}</span>
    </a>
    <a [routerLink]="['/expense-analytics']" routerLinkActive="active" class="nav-item">
      <span class="msym" aria-hidden="true">insights</span>
      <span>{{ 'nav.analytics' | translate }}</span>
    </a>
    <a [routerLink]="['/course-calendar']" routerLinkActive="active" class="nav-item">
      <span class="msym" aria-hidden="true">calendar_month</span>
      <span>{{ 'nav.courseSchedule' | translate }}</span>
    </a>
    <a [routerLink]="['/settings']" routerLinkActive="active" class="nav-item">
      <span class="msym" aria-hidden="true">settings</span>
      <span>{{ 'nav.settings' | translate }}</span>
    </a>
  </nav>

  <main class="main-content-panel">
    <router-outlet></router-outlet>
  </main>
</div>
