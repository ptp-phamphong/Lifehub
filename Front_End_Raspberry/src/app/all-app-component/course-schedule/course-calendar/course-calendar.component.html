
<div class="view-toggle-bar">
  <span class="toggle-label" [class.active]="!showMonth">Tuần</span>
  <label class="toggle-switch">
    <input type="checkbox" [(ngModel)]="showMonth" name="showMonth" />
    <span class="toggle-slider"></span>
  </label>
  <span class="toggle-label" [class.active]="showMonth">Tháng</span>
</div>

<div class="view-toggle-bar" *ngIf="showMonth">
  <span class="toggle-label" [class.active]="!showExpense">Thời khóa biểu</span>
  <label class="toggle-switch">
    <input type="checkbox" [(ngModel)]="showExpense" name="showExpense" />
    <span class="toggle-slider"></span>
  </label>
  <span class="toggle-label" [class.active]="showExpense">Chi tiêu</span>
</div>

<ng-container *ngIf="showMonth">
  <app-course-month-calendar [showExpense]="showExpense"></app-course-month-calendar>
</ng-container>

<ng-container *ngIf="!showMonth">
  <app-course-week-calendar></app-course-week-calendar>
</ng-container>
