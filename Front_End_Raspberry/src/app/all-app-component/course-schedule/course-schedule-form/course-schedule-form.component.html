<div class="course-form">
  <h2>{{ (id > 0 ? 'course.formTitleEdit' : 'course.formTitleAdd') | translate }}</h2>
  <form (ngSubmit)="submitForm()">

    <div class="form-group">
      <label for="courseCode">{{ 'course.code' | translate }} <span class="required">*</span></label>
      <input id="courseCode" type="text" [(ngModel)]="courseCode" name="courseCode"
        [placeholder]="'course.codePlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="courseName">{{ 'course.name' | translate }} <span class="required">*</span></label>
      <input id="courseName" type="text" [(ngModel)]="courseName" name="courseName"
        [placeholder]="'course.namePlaceholder' | translate" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startDate">{{ 'course.startDate' | translate }}</label>
        <mat-form-field appearance="outline" class="date-field">
          <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" name="startDate"
            [placeholder]="'course.selectDate' | translate" />
          <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label for="endDate">{{ 'course.endDate' | translate }}</label>
        <mat-form-field appearance="outline" class="date-field">
          <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" name="endDate"
            [placeholder]="'course.selectDate' | translate" />
          <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startTime">{{ 'course.startTime' | translate }}</label>
        <input id="startTime" type="time" [(ngModel)]="startTime" name="startTime" />
      </div>

      <div class="form-group">
        <label for="endTime">{{ 'course.endTime' | translate }}</label>
        <input id="endTime" type="time" [(ngModel)]="endTime" name="endTime" />
      </div>
    </div>

    <div class="form-group">
      <label for="room">{{ 'course.room' | translate }}</label>
      <input id="room" type="text" [(ngModel)]="room" name="room"
        [placeholder]="'course.roomPlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="address">{{ 'course.address' | translate }}</label>
      <input id="address" type="text" [(ngModel)]="address" name="address"
        [placeholder]="'course.addressPlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="semesterMetadataId">{{ 'course.semester' | translate }}</label>
      <select id="semesterMetadataId" [(ngModel)]="semesterMetadataId" name="semesterMetadataId">
        <option [ngValue]="null">{{ 'course.noSemesterSelected' | translate }}</option>
        <option *ngFor="let semester of semesters" [ngValue]="semester.id">
          {{ semester.codeSemester }} - {{ semester.semesterName }} ({{ semester.year }})
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="dayOfWeek">{{ 'course.dayOfWeekField' | translate }} <span class="required">*</span></label>
      <select id="dayOfWeek" [(ngModel)]="dayOfWeek" name="dayOfWeek">
        <option [ngValue]="null" disabled>{{ 'course.selectDayOfWeek' | translate }}</option>
        <option *ngFor="let option of dayOfWeekOptions" [ngValue]="option.value">
          {{ option.labelKey | translate }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn-submit">{{ 'common.save' | translate }}</button>
  </form>

  <p class="message" [class.is-success]="messageType === 'success'" [class.is-error]="messageType === 'error'" [class.is-warning]="messageType === 'warning'" *ngIf="messageKey">
    <span class="msym" aria-hidden="true">{{ messageType === 'success' ? 'check_circle' : messageType === 'error' ? 'error' : 'warning' }}</span>
    <span>{{ messageKey | translate }}</span>
  </p>

  <div class="btn-cancel-wrapper">
    <button class="btn-cancel" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  </div>
</div>
