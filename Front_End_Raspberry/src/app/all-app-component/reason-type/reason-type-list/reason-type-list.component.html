<div class="expense-table-container">

  <h2>Danh sách lý do</h2>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn-add" (click)="openEditDialog(0)">+ Thêm mới</button>
  </div>

  <table class="expense-table">
    <thead>
      <tr>
        <th>Mã</th>
        <th>Tên lý do</th>
        <th>Thứ tự</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of reasonTypes">
        <td>{{ item.id }}</td>
        <td>{{ item.reasonName }}</td>
        <td>{{ item.sortOrder }}</td>
        <td>
          <span class="badge" [class.badge-active]="item.active" [class.badge-inactive]="!item.active">
            {{ item.active ? 'Hoạt động' : 'Ẩn' }}
          </span>
        </td>
        <td class="col-actions">
          <button class="btn-action btn-edit" (click)="openEditDialog(item.id)">Sửa</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
