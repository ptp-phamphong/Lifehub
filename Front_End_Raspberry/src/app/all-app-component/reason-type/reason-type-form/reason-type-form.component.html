<div class="expense-form">
  <h2>{{ id > 0 ? 'Chỉnh sửa lý do' : 'Thêm lý do mới' }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="reasonName">Tên lý do</label>
      <input id="reasonName" type="text" [(ngModel)]="reasonName" name="reasonName" placeholder="Nhập tên lý do..." />
    </div>

    <div class="form-group">
      <label for="sortOrder">Số thứ tự</label>
      <input id="sortOrder" type="number" [(ngModel)]="sortOrder" name="sortOrder" placeholder="Nhập số thứ tự..." />
    </div>

    <div class="form-group">
      <label>Loại lọc mặc định <span class="required-mark">*</span></label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="1" />
          Không có mặc định
        </label>
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="2" />
          Mặc định lọc theo
        </label>
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="3" />
          Mặc định lọc theo không phải
        </label>
      </div>
    </div>

    <div class="form-group form-group-checkbox">
      <label for="active">Hoạt động</label>
      <label class="toggle">
        <input id="active" type="checkbox" [(ngModel)]="active" name="active" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <button type="submit">Lưu</button>
  </form>

  <p class="message" [class.is-success]="messageType === 'success'" [class.is-error]="messageType === 'error'" [class.is-warning]="messageType === 'warning'" *ngIf="message">
    <span class="msym" aria-hidden="true">{{ messageType === 'success' ? 'check_circle' : messageType === 'error' ? 'error' : 'warning' }}</span>
    <span>{{ message }}</span>
  </p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">Hủy</button>
  </div>
</div>
