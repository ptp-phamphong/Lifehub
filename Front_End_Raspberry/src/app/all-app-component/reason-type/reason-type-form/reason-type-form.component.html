<div class="expense-form">
  <h2>{{ (id > 0 ? 'reasonType.editTitle' : 'reasonType.addTitle') | translate }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="reasonName">{{ 'reasonType.name' | translate }}</label>
      <input id="reasonName" type="text" [(ngModel)]="reasonName" name="reasonName" [placeholder]="'reasonType.namePlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="sortOrder">{{ 'reasonType.sortOrder' | translate }}</label>
      <input id="sortOrder" type="number" [(ngModel)]="sortOrder" name="sortOrder" [placeholder]="'reasonType.sortOrderPlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label>{{ 'reasonType.defaultFilter' | translate }} <span class="required-mark">*</span></label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="1" />
          {{ 'reasonType.filterNone' | translate }}
        </label>
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="2" />
          {{ 'reasonType.filterInclude' | translate }}
        </label>
        <label class="radio-label">
          <input type="radio" name="defaultFilterType" [(ngModel)]="defaultFilterType" [value]="3" />
          {{ 'reasonType.filterExclude' | translate }}
        </label>
      </div>
    </div>

    <div class="form-group form-group-checkbox">
      <label for="active">{{ 'reasonType.active' | translate }}</label>
      <label class="toggle">
        <input id="active" type="checkbox" [(ngModel)]="active" name="active" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <button type="submit">{{ 'common.save' | translate }}</button>
  </form>

  <p class="message" [class.is-success]="messageType === 'success'" [class.is-error]="messageType === 'error'" [class.is-warning]="messageType === 'warning'" *ngIf="messageKey">
    <span class="msym" aria-hidden="true">{{ messageType === 'success' ? 'check_circle' : messageType === 'error' ? 'error' : 'warning' }}</span>
    <span>{{ messageKey | translate }}</span>
  </p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  </div>
</div>
