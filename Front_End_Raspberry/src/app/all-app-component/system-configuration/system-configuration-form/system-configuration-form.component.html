<div class="expense-form">
  <h2>{{ (id > 0 ? 'systemConfig.editTitle' : 'systemConfig.addTitle') | translate }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="keyConfig">{{ 'systemConfig.key' | translate }}</label>
      <input id="keyConfig" type="text" [(ngModel)]="keyConfig" name="keyConfig" [placeholder]="'systemConfig.keyPlaceholder' | translate" />
    </div>

    <div class="form-group">
      <label for="valueConfig">{{ 'systemConfig.value' | translate }}</label>
      <input id="valueConfig" type="text" [(ngModel)]="valueConfig" name="valueConfig" [placeholder]="'systemConfig.valuePlaceholder' | translate" />
    </div>

    <button type="submit">{{ 'common.save' | translate }}</button>
  </form>

  <p class="message" *ngIf="messageKey">{{ messageKey | translate }}</p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  </div>
</div>
