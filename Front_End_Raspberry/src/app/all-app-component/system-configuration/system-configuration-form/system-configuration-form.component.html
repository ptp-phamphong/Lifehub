<div class="expense-form">
  <h2>{{ id > 0 ? 'Chỉnh sửa cấu hình đặc biệt' : 'Thêm cấu hình đặc biệt' }}</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="keyConfig">Khóa cấu hình</label>
      <input id="keyConfig" type="text" [(ngModel)]="keyConfig" name="keyConfig" placeholder="Nhập khóa cấu hình..." />
    </div>

    <div class="form-group">
      <label for="valueConfig">Giá trị cấu hình</label>
      <input id="valueConfig" type="text" [(ngModel)]="valueConfig" name="valueConfig" placeholder="Nhập giá trị cấu hình..." />
    </div>

    <button type="submit">Lưu</button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>

  <div class="cancel-row">
    <button type="button" (click)="cancel()">Hủy</button>
  </div>
</div>
